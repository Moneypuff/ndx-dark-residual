name: Build & Deploy Dashboard (GitHub Pages)

# Builds the dashboard (index + comovement) AND the earnings-DPI study, then publishes the
# whole docs/ folder to GitHub Pages as a build ARTIFACT -- nothing is committed to git. This
# replaces the old commit-and-push refresh (which wrote a ~13 MB docs/index.html into history
# every night and bloated the repo). The data still has to be computed by this build (a browser
# can't run the FINRA math); we just stop storing the result in git.
#
# ONE-TIME SETUP (repo owner): Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions". Until that is set, the "Deploy to GitHub Pages" step will fail; the build
# steps still run fine.

on:
  # Manual "Run workflow" button on the Actions tab -- use this for an immediate rebuild/redeploy.
  workflow_dispatch:
    inputs:
      refresh:
        description: "Force re-download of cached FINRA/Yahoo data (slower, fully fresh)"
        type: boolean
        default: false
  # Auto-refresh at 10:00pm America/New_York every trading day (Mon-Fri). GitHub cron is
  # fixed-UTC and cannot follow US daylight-saving, so BOTH candidate times fire and the `gate`
  # job lets exactly one through -- whichever cron MAPS to 22:00 ET today (the gate keys off the
  # triggering cron, not the wall clock, so a run GitHub delayed still counts). FINRA publishes
  # the session's consolidated short-volume file after ~5pm ET; Cboe's COR1M/DSPX and
  # SqueezeMetrics' GEX+/DIX EOD files have been observed publishing anywhere from ~9:30pm ET to
  # well past 10pm some evenings -- an earlier 7pm, then 9pm slot both still landed a session
  # behind on nights the feed ran late, so this pushes the buffer to 10pm. (gex_catchup.yml picks
  # up whatever this still misses, retrying hourly 11pm-6am ET -- an hour after this slot, so the
  # two workflows never contend for the `pages` concurrency group at the same moment.) Minute
  # offset to :07 (not :00) since scheduled workflows anchored exactly on the hour are a documented
  # GitHub Actions congestion point and can queue for a while longer than an off-the-hour slot.
  schedule:
    - cron: "7 2 * * 2-6"    # 02:07 UTC = 10:00pm ET during EDT (UTC-4), Mon-Fri ET (next UTC day)
    - cron: "7 3 * * 2-6"    # 03:07 UTC = 10:00pm ET during EST (UTC-5), Mon-Fri ET (next UTC day)

# No `contents: write` -- the site is deployed as an artifact, so the workflow never pushes to
# the repo. `pages: write` + `id-token: write` are what actions/deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys; never cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate: proceed only for the cron that represents 10:00pm ET on a weekday (so the "wrong" cron
  # for the current DST offset is skipped), or on any manual/other trigger.
  #
  # This is DELAY-TOLERANT by design. The gate must NOT test the wall-clock hour at execution
  # time: GitHub's scheduler routinely delays cron runs 30-90+ minutes, and the old
  # `[ "$hour" = "22" ]` check made a delayed-but-correct run push past 22:xx ET into 23:xx and
  # skip its own build -- silently, since a skipped `build` job still leaves the run green. (The
  # optsnap.yml gate learned the same lesson; see its comment.) Instead we key off the cron that
  # actually TRIGGERED this run -- github.event.schedule carries the exact cron string -- and
  # compute what ET hour that cron's SCHEDULED instant maps to today. That mapping is independent
  # of how late GitHub actually started the run, and still lets exactly one of the two DST crons
  # through: whichever one lands on 22:00 ET tonight.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Decide whether to run (cron that maps to 10:00pm ET on a trading day)
        id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Non-schedule trigger (${{ github.event_name }}) -> proceed."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # UTC hour field of the cron that fired this run ("2" for "7 2 * * 2-6", "3" for "7 3 ...").
          sched_hour=$(printf '%s\n' "$SCHEDULE" | awk '{print $2}')
          # This cron's scheduled instant, as a UTC timestamp on today's UTC date. (A cron delayed
          # up to ~21h still executes on its own UTC day, so today's UTC date is the right anchor.)
          instant="$(date -u +%Y-%m-%d)T$(printf '%02d' "$sched_hour"):00:00Z"
          # Map that fixed instant into America/New_York -- this resolves EDT vs EST automatically.
          et_hour=$((10#$(TZ=America/New_York date -d "$instant" +%H)))   # 10# forces decimal
          et_dow=$(TZ=America/New_York date -d "$instant" +%u)            # 1=Mon .. 7=Sun (ET local)
          echo "Triggered by cron '$SCHEDULE' -> its 10pm-candidate instant $instant maps to ${et_hour}:00 ET (dow=$et_dow)."
          if [ "$et_hour" -eq 22 ] && [ "$et_dow" -ge 1 ] && [ "$et_dow" -le 5 ]; then
            echo "This cron is tonight's 22:00 ET weekday slot -> proceed (regardless of scheduler delay)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "This cron maps to ${et_hour}:00 ET dow=$et_dow, not the 22:00 ET weekday slot -> skip."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  # Build is separate from deploy so a workflow_dispatch on a feature branch can
  # exercise the whole pipeline (tests, data fetch, all page builds, artifact) --
  # the github-pages environment's branch policy would otherwise reject the job
  # outright. Only main deploys the live site.
  build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Gate the refresh on the unit tests: a logic regression must not be
      # committed to the published dashboard. Deterministic and offline (~seconds).
      - name: Run tests
        run: python -m pytest

      # Persist FINRA/Yahoo cache between runs so each refresh only fetches new days. One shared
      # cache now covers both the dashboard and earnings builds (they hit the same FINRA/Yahoo
      # data). The run_id in the key makes every run save a fresh cache; restore-keys pulls the
      # newest previous one.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: .ndx_dark_cache
          key: ndx-dark-cache-v3-${{ github.run_id }}
          restore-keys: |
            ndx-dark-cache-v3-
            ndx-dark-cache-

      # Optional: refresh data/watchlist.csv (the Watchlist tab's ticker list) from a published
      # Google Sheet before building. Skipped unless the repo variable WATCHLIST_SHEET_CSV_URL is
      # set (Settings -> Secrets and variables -> Actions -> Variables). A failed sync leaves the
      # committed CSV untouched.
      - name: Sync watchlist from Google Sheet (optional)
        if: ${{ vars.WATCHLIST_SHEET_CSV_URL != '' }}
        run: python sync_watchlist.py --url "${{ vars.WATCHLIST_SHEET_CSV_URL }}"

      - name: Build dashboard
        run: >
          python ndx_dark_residual.py
          --out docs/index.html
          --cache-dir .ndx_dark_cache
          ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }}

      # Cross-index DIX comovement tab: reads the DIX payload just written into docs/index.html
      # and joins it to QQQ/SPY/IWM closes (same Yahoo cache).
      - name: Build comovement tab
        run: >
          python build_comovement.py
          --payload docs/index.html
          --docs-out docs/comovement.html
          --cache-dir .ndx_dark_cache

      # GEX x dispersion barometer: SqueezeMetrics gamma + Cboe COR1M/DSPX + our own realized
      # correlation/dispersion from the top-50 IVV names (same Yahoo cache). With the
      # GEXPLUS_KEY repo secret set (Settings -> Secrets and variables -> Actions) the gamma
      # gauge is the yacht-club GEX+ feed (2004->); without it, the free classic GEX CSV.
      - name: Build GEX dispersion barometer
        env:
          GEXPLUS_KEY: ${{ secrets.GEXPLUS_KEY }}
        run: >
          python build_gex_dispersion.py
          --docs-out docs/gex_dispersion.html
          --cache-dir .ndx_dark_cache
          ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }}

      # Regime log: the barometer's playbook page -- posture, dated break signals with
      # context buckets and realized outcomes, sector leaderboard. Reads the barometer
      # payload written by the previous step.
      - name: Build regime log
        env:
          GEXPLUS_KEY: ${{ secrets.GEXPLUS_KEY }}
        run: >
          python build_regime_log.py
          --barometer docs/gex_dispersion.html
          --docs-out docs/regime_log.html
          --cache-dir .ndx_dark_cache
          ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }}

      # Vol tracker -> docs/vol_tracker.html (linked from the regime log's strip). Reads the
      # daily chain snapshots off the optsnap-data branch (written by optsnap.yml); before the
      # first capture exists the page renders as a stub, so this step never fails the build.
      - name: Fetch chain snapshots (optsnap-data branch)
        run: |
          if git fetch origin optsnap-data --depth 1; then
            git checkout origin/optsnap-data -- optsnap/ 2>/dev/null || echo "branch has no optsnap/ dir yet"
          else
            echo "no optsnap-data branch yet -- vol tracker renders a stub"
          fi

      - name: Build vol tracker
        run: >
          python build_vol_tracker.py
          --snap-dir optsnap
          --docs-out docs/vol_tracker.html
          --cache-dir .ndx_dark_cache

      # 3D vol surface viewer -> docs/vol_surface.html. Same snapshot data as the
      # vol tracker; renders a stub until the first capture exists.
      - name: Build vol surface viewer
        run: >
          python build_vol_surface.py
          --snap-dir optsnap
          --docs-out docs/vol_surface.html

      # Earnings-DPI study -> docs/earnings.html (linked from the dashboard's "Earnings DIX" tab).
      - name: Refresh earnings dates from SEC EDGAR
        run: python fetch_earnings_edgar.py --out earnings_dates_edgar.csv

      - name: Run DPI-into-earnings study
        run: >
          python earnings_dpi_study.py
          --earnings earnings_dates_edgar.csv
          --cache-dir .ndx_dark_cache
          --out-prefix earnings_dpi
          --summary-out earnings_dpi_summary.txt
          ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }}

      - name: Rebuild interactive earnings report (Pages copy)
        run: python build_report.py --cache-dir .ndx_dark_cache --docs-out docs/earnings.html

      # Publish the whole docs/ folder (index.html, comovement.html, earnings.html,
      # gex_dispersion.html, regime_log.html, .nojekyll) as the Pages artifact for the
      # deploy job. No git commit anywhere in this workflow.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
